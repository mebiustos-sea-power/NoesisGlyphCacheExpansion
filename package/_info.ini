[Language_en]
Name=Glyph Cache Expansion
Description=Expands Sea Power's glyph cache to 4096x4096. This may reduce missing characters in affected environments. Requires Anchor Chain. Restart Sea Power after enabling or disabling this mod.

[Language_ja]
Name=Glyph Cache Expansion
Description=Sea Powerの字形キャッシュを4096×4096へ拡大します。環境によっては文字欠けが改善する可能性があります。Anchor Chainが必要です。有効・無効の変更後はゲームを再起動してください。
